# One command runs the database + API locally:  docker compose up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: profmatch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/profmatch
      JWT_SECRET: change-me-in-production
      PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
